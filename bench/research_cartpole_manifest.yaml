output_dir: bench_runs/cartpole_research
jobs:
  - name: cartpole_baseline
    command: audit-sb3
    matrix:
      seed: [0, 1, 2, 3, 4]
    args:
      algo: "ppo"
      env: "CartPole-v1"
      model: "checkpoints_cartpole_ppo/baseline/seed_{seed}/model.zip"
      seed: "{seed}"
      seeds: ["{seed}"]
      episodes: 30
      speeds: [1, 2, 3, 5, 8]
      adaptive: false
      workers: "auto"
      protocol: "research"
      allow_protocol_override: true
      explain_fail: true
      out: "bench_runs/cartpole_research/baseline/seed_{seed}"

  - name: cartpole_intervention1_curriculum
    command: audit-sb3
    matrix:
      seed: [0, 1, 2, 3, 4]
    args:
      algo: "ppo"
      env: "CartPole-v1"
      model: "checkpoints_cartpole_ppo/intervention1_curriculum/seed_{seed}/model.zip"
