      speeds: [1, 2, 3, 5, 8]
      adaptive: false
      workers: "auto"
      protocol: "research"
      allow_protocol_override: true
      explain_fail: true
      out: "bench_runs/cartpole_research/intervention1_curriculum/seed_{seed}"

  - name: cartpole_intervention2_time_feature
    command: audit-sb3
    matrix:
      seed: [0, 1, 2, 3, 4]
    args:
      algo: "ppo"
      env: "CartPole-v1"
      model: "checkpoints_cartpole_ppo/intervention2_time_feature/seed_{seed}/model.zip"
      seed: "{seed}"
