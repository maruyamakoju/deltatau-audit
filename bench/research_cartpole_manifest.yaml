      episodes: 30
      speeds: [1, 2, 3, 5, 8]
      adaptive: false
      workers: "auto"
      protocol: "research"
      allow_protocol_override: true
      explain_fail: true
      env_wrap_time_feature: true
      out: "bench_runs/cartpole_research/intervention2_time_feature/seed_{seed}"

  - name: cartpole_intervention1_plus_2
