output_dir: bench_runs
jobs:
  - name: sb3_matrix
    command: audit-sb3
    matrix:
      env: ["CartPole-v1", "Acrobot-v1"]
      algo: ["ppo", "a2c"]
      seed: [0, 1, 2, 3, 4]
    args:
      algo: "{algo}"
      model: "models/{algo}_{env}_seed_{seed}.zip"
      env: "{env}"
      seed: "{seed}"
      seeds: ["{seed}"]
      adaptive: false
      protocol: "research"
      allow_protocol_override: true
      ci: true
      ci_gate_mode: "worst_ci_lower"
